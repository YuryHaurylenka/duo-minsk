<style>
:root{--lime:#c8ff55;--violet:#9a7cff}
body{background:#090a0d}.topbar{position:sticky;top:0;z-index:20;background:#090a0ddd;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;gap:16px}
.brand{letter-spacing:-.055em}.brandmark{box-shadow:0 0 28px #c8ff5533}
.hero{padding-top:88px}.hero h1{font-size:clamp(64px,9vw,132px);background:linear-gradient(110deg,#fff 12%,#c8ff55 64%,#a7ffbc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:16px;max-width:600px}.stat{backdrop-filter:blur(12px);background:linear-gradient(145deg,#1a1d22,#111318);border-color:#ffffff13}.stat b{font-variant-numeric:tabular-nums}
.filterbox{background:#121419ef;border-color:#ffffff15;box-shadow:0 24px 70px #0005}.control{transition:.2s}.control:hover{border-color:#69734f}
.card{background:linear-gradient(155deg,#1a1d23,#111318);border-color:#ffffff13;box-shadow:0 12px 36px #0003}.cardvisual{height:172px;background:radial-gradient(ellipse at 50% 120%,#c8ff5522,transparent 60%),linear-gradient(135deg,#222a1b,#181b25)}.cardvisual:after{width:230px;height:230px;background:#9a7cff17;filter:blur(35px)}.visualemoji{font-size:76px;transition:transform .35s}.card:hover .visualemoji{transform:scale(1.13) rotate(-4deg)}
.cardbody{padding:18px 20px 20px}.card h3{font-size:22px;letter-spacing:-.055em}.card .desc{font-size:12px;line-height:1.7}.card:hover{border-color:#c8ff5566}
.btn{box-shadow:0 8px 24px #c8ff5522}.btn:active,.personal-btn:active{transform:scale(.98)}
.auth-trigger{display:flex;align-items:center;gap:9px;border:1px solid #ffffff20;background:#171a20;color:#fff;border-radius:999px;padding:9px 14px;font:700 11px 'DM Sans';cursor:pointer}.auth-trigger i{width:8px;height:8px;border-radius:50%;background:#c8ff55;box-shadow:0 0 12px #c8ff55}
.topbar-right{display:flex;align-items:center;gap:14px;margin-left:auto}
#authLayer{position:fixed;inset:0;z-index:1000;background:#050608d9;backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:18px}#authLayer.open{display:flex}
.auth-panel{width:min(100%,470px);background:linear-gradient(145deg,#1a1d23,#101216);border:1px solid #ffffff1c;border-radius:26px;padding:30px;box-shadow:0 35px 100px #000b;position:relative}
.auth-close{position:absolute;right:18px;top:16px;background:#ffffff10;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.auth-kicker{color:#c8ff55;font-size:10px;letter-spacing:.17em;font-weight:800;text-transform:uppercase}.auth-panel h2{font-size:34px;letter-spacing:-.07em;line-height:1;margin:12px 0}.auth-sub{font-size:12px;line-height:1.7;color:#a4aab4;margin-bottom:22px}
.auth-tabs{display:flex;background:#0b0d10;border:1px solid #ffffff12;padding:4px;border-radius:12px;margin-bottom:16px}.auth-tabs button{flex:1;background:transparent;border:0;color:#8e96a2;border-radius:9px;padding:10px;font:700 11px 'DM Sans';cursor:pointer}.auth-tabs button.active{background:#c8ff55;color:#10130b}
.auth-field{display:grid;gap:7px;margin:12px 0}.auth-field label{font-size:10px;color:#a9b0ba;font-weight:700}.auth-field input{height:46px;background:#0b0d11;border:1px solid #333842;border-radius:11px;padding:0 13px;color:#fff;font:500 13px 'DM Sans';outline:none}.auth-field input:focus{border-color:#c8ff55;box-shadow:0 0 0 3px #c8ff5519}
.auth-submit{width:100%;height:48px;border:0;border-radius:12px;background:#c8ff55;color:#10130b;font:800 12px 'DM Sans';cursor:pointer;margin-top:10px}.auth-message{font-size:11px;line-height:1.5;color:#ffc979;min-height:18px;margin-top:10px}
.couple-code{font-size:28px;letter-spacing:.22em;font-weight:800;color:#c8ff55;background:#0b0d11;border:1px dashed #657344;border-radius:14px;padding:16px;text-align:center;margin:14px 0}
.auth-secondary{width:100%;height:44px;border:1px solid #ffffff20;border-radius:11px;background:#ffffff08;color:#fff;font:700 11px 'DM Sans';cursor:pointer;margin-top:9px}.auth-profile{font-size:11px;color:#aab1bb;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:620px){.wrap{padding:0 14px}.hero{padding-top:54px}.hero h1{font-size:clamp(58px,16vw,78px)}.topbar{height:64px}.brand{font-size:14px}.topmeta{display:none}.auth-trigger{padding:8px 10px;font-size:10px}.auth-panel{padding:25px 20px}.auth-panel h2{font-size:30px}.cardvisual{height:145px}}
</style>
<div id="authLayer" aria-hidden="true"><section class="auth-panel"><button class="auth-close" id="authClose" aria-label="Закрыть">×</button><div class="auth-kicker">MINSK AFTERDARK · PRIVATE SPACE</div><h2 id="authTitle">Ваше место<br>для двоих.</h2><p class="auth-sub" id="authSub">Войдите или создайте аккаунт, чтобы ваши свидания сохранялись.</p><div id="authBody"></div><div class="auth-message" id="authMessage" role="status"></div></section></div>
