name: DUO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/duo_ci
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: python -m pytest -q

      - name: Run optional PostgreSQL RLS integration tests
        env:
          DUO_RLS_TEST_DATABASE_URL: ${{ secrets.DUO_RLS_TEST_DATABASE_URL }}
        run: |
          if [ -z "$DUO_RLS_TEST_DATABASE_URL" ]; then
            echo "DUO_RLS_TEST_DATABASE_URL is not configured; skipping live database tests."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$DUO_RLS_TEST_DATABASE_URL" --set ON_ERROR_STOP=1 --file ../supabase/tests/database/rls_isolation.sql

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build
